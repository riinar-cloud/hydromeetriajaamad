name: Uuenda andmeid

on:
  schedule:
    # Operatiivnäidud iga tund. GitHubi cron hilineb koormuse all, vt README.
    - cron: "15 * * * *"
    # Täisehitus kord ööpäevas. 07:30 UTC, sest EstModel avaldab eelmise päeva
    # hommikul kella 9 paiku Eesti aja järgi. Cron on ALATI UTC ega tunne suveaega:
    # 07:30 UTC on suvel 10:30 ja talvel 09:30, seega kunagi liiga vara.
    # Varem oli 05:40 UTC ja see jäi mõnel päeval EstModelist ette.
    - cron: "30 7 * * *"
    # Kord kuus kogu ajalugu uuesti. Igapäevane täisehitus tõmbab ainult viimased
    # aastad ja võtab vanema osa CSV-dest; nii ei jõuaks kohale see, kui agentuur
    # on vanu ridu vahepeal valideerinud või parandanud.
    # Kord nädalas veetase ja temperatuur kõigile jaamadele. Igapäevane jooks tõmbab
    # EstModelist ainult vooluhulga: lehel kuvatav veetase tuleb ilmateenistuse XML-ist
    # reaalajas ja EstModeli H on CSV-s ööpäeva keskmine. Analüüsiks kasutatakse
    # valideeritud andmeid, mis liiguvad kord aastas.
    - cron: "0 3 * * 0"
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      taisehitus:
        description: "Tee täisehitus (aegread ja CSV-d uuesti)"
        type: boolean
        default: false
      koik_naidud:
        description: "Tõmba ka veetase ja temperatuur kõigile (nädalane jooks)"
        type: boolean
        default: false
      taielik:
        description: "Tõmba kogu ajalugu uuesti (aeglane, ~400 MB)"
        type: boolean
        default: false

permissions:
  contents: write

# Täisehitus ja tunnine uuendus EI tohi olla samas järjekorras. 20.10.2026 kestis
# täisehitus 3,5 tundi (EstModeli piirangu tõttu) ja blokeeris kogu selle aja tunnised
# jooksud — veetaseme logisse jäi 3,5-tunnine auk ja 12 h vahe kadus lehelt ära.
concurrency:
  group: uuendus-${{ inputs.taisehitus == 'true' || inputs.taielik == 'true'
    || github.event.schedule == '30 7 * * *' || github.event.schedule == '0 4 1 * *'
    || github.event.schedule == '0 3 * * 0' || inputs.koik_naidud == 'true' }}
  cancel-in-progress: false

jobs:
  uuenda:
    runs-on: ubuntu-latest
    # Täisehitus võttis 20.10 piirangu tõttu 3,5 tundi. Piir hoiab ära, et mõni jooks
    # saaks tunde põleda ja järgmised enda taha kinni hoida.
    # EstModel laseb läbi ~1 päringu minutis. Igapäevane jooks teeb 68 päringut
    # (~60 min), nädalane 182 (~160 min). Piir hoiab ära tundide kaupa põlemise.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paigalda sõltuvused
        # pyproj: koordinaaditeisendus L-EST97 -> WGS84
        # pillow: jaama märgi joonistamine ortofotole
        run: pip install pyproj pillow

      - name: Vali režiim
        id: reziim
        run: |
          if [ "${{ github.event.schedule }}" = "0 4 1 * *" ] || \
             [ "${{ inputs.taielik }}" = "true" ]; then
            echo "lipud=--taielik --valjund docs" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 3 * * 0" ] || \
               [ "${{ inputs.koik_naidud }}" = "true" ]; then
            echo "lipud=--koik-naidud --valjund docs" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 7 * * *" ] || \
               [ "${{ inputs.taisehitus }}" = "true" ]; then
            echo "lipud=--valjund docs" >> "$GITHUB_OUTPUT"
          else
            echo "lipud=--only-now --valjund docs" >> "$GITHUB_OUTPUT"
          fi

      - name: Ehita
        run: python ehita_veeb.py ${{ steps.reziim.outputs.lipud }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs andmed
          if git diff --staged --quiet; then
            echo "muutusi ei ole"
            exit 0
          fi
          git commit -m "Andmed $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Push võib olla tõrjutud, kui vahepeal on keegi teine commit'inud: teine
          # jooks, käsitsi käivitus või kasutaja ise. Juhtus päriselt 18.09 kell 07:26.
          # Andmefailid tekitatakse tervikuna uuesti, seega konflikti korral võidab
          # meie versioon: rebase'i ajal tähendab -X theirs just seda commit'i,
          # mida parasjagu peale kantakse.
          for katse in 1 2 3; do
            if git push; then exit 0; fi
            echo "push tõrjuti ($katse), tõmban uue seisu ja proovin uuesti"
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          echo "push ei õnnestunud kolme katsega"
          exit 1
